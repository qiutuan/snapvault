[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "snapvault-core"
version = "0.1.0"
description = "SnapVault core — 本地截图资产管理系统（OCR / embedding / 混合检索 / 标注 / 导出，全离线）"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "qiutuan" }]
dependencies = [
    "Pillow>=10.0",
    "numpy>=1.24",
    "onnxruntime>=1.16",
    "rapidocr_onnxruntime>=1.3.9",
    "sqlite-vec>=0.1.6",
    "fastembed>=0.3.0",
    "reportlab>=4.0",
    "mss>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
snapvault = "snapvault.cli:main"

[tool.setuptools.packages.find]
where = ["core"]

[tool.setuptools.package-data]
snapvault = ["models/rapidocr/*.onnx", "models/rapidocr/*.md", "py.typed"]

[tool.pytest.ini_options]
testpaths = ["core/tests", "tests"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["snapvault"]
omit = ["*/tests/*", "snapvault/cli.py"]

[tool.coverage.report]
show_missing = true
fail_under = 80
